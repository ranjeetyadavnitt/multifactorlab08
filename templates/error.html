{% extends "base.html" %}

{% block title %}{{ error_title }} | SecureShop{% endblock %}

{% block content %}
<div style="background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: 48px; text-align: center; max-width: 580px; margin: 40px auto; box-shadow: var(--shadow-lg);">
    <div style="font-size: 56px; color: {% if error_code == 403 %}#ef4444{% elif error_code == 404 %}var(--accent-amber){% else %}var(--primary){% endif %}; margin-bottom: 16px;">
        <i class="fas {% if error_code == 403 %}fa-shield-halved{% elif error_code == 404 %}fa-compass{% else %}fa-triangle-exclamation{% endif %}"></i>
    </div>
    <h1 style="font-size: 28px; font-weight: 800; margin-bottom: 8px;">{{ error_code }} - {{ error_title }}</h1>
    <p style="color: var(--text-secondary); margin-bottom: 24px; font-size: 15px; line-height: 1.6;">
        {{ error_message }}
    </p>
    <div style="display: flex; gap: 12px; justify-content: center;">
        <a href="{{ url_for('index') }}" class="btn btn-primary">
            <i class="fas fa-home"></i> Return to Safety (Home)
        </a>
        <a href="{{ url_for('products') }}" class="btn btn-secondary">
            <i class="fas fa-microchip"></i> Hardware Catalog
        </a>
    </div>
</div>
{% endblock %}
